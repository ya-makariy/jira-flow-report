name: Release

# Publishing is driven by a tag, so the released artefact always corresponds to a
# commit someone deliberately marked.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  verify:
    name: verify the tag and the tree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: The tag must match the project version
        id: check
        # Publishing 0.2.0 from a tag that says v0.3.0 is unrecoverable: PyPI
        # will not let the version be reused. Fail here instead.
        run: |
          set -euo pipefail
          version=$(uv run python -c \
            'import tomllib,pathlib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          echo "project=$version tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync
      - name: Full suite must pass before anything is published
        run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Build info is baked in
        run: |
          set -euo pipefail
          python -m zipfile -e "$(ls dist/*.whl)" unpacked/
          cat unpacked/jira_flow_report/_build.py
          grep -q "VERSION = '${{ needs.verify.outputs.version }}'" \
            unpacked/jira_flow_report/_build.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token anywhere in the repository or its secrets.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: GitHub release
    needs: [verify, build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: dist/*
