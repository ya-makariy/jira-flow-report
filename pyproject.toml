[project]
name = "jira-flow-report"
version = "0.1.0"
description = "Kanban flow reports for any Jira board, and a Claude skill that drives them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["jira", "kanban", "retrospective", "reporting", "claude", "agent-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
]
dependencies = [
  "jira>=3.8",
  "tomli-w>=1.0",
]

[project.scripts]
jira-flow-report = "jira_flow_report.cli:main"

[project.urls]
Homepage = "https://github.com/ya-makariy/jira-flow-report"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_flow_report"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "jira_flow_report/skill"
